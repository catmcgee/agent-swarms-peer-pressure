name: smoke
tasks_path: tasks/smoke.yaml
peer_boards_path: peer_boards/smoke.yaml
output_dir: ../results/smoke
seeds: [11]
max_cost_usd: 0
require_authentic_boards: false

factors:
  feasibility: [feasible, impossible]
  investment: [inherited, personal]
  peer_norm: [absent, stop, proceed]
  budget_rounds: [2, 8]

inference:
  provider: scripted
  model: scripted-social
  temperature: 0.0
  max_output_tokens: 200
