[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmstop"
version = "0.1.0"
description = "Evaluation harness for post-recognition authorization reversals in agent swarms"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cat McGee"}]
dependencies = [
  "openai>=1.66.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
]
dataset = ["huggingface-hub>=0.30.0"]
gpu = [
  "accelerate>=1.10.0",
  "huggingface-hub>=0.30.0",
  "torch>=2.8.0",
  "transformers>=5.5.0",
]

[project.scripts]
swarmstop = "swarmstop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data/upstreams", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
